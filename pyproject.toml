[project]
name = "binctl-tui"
version = "0.1.0"
description = "TUI frontend for https://github.com/clueboard/binctl"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "binctl-client>=1.0.0",
    "platformdirs>=4.11.0",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
]

[project.scripts]
binctl-tui = "binctl_tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
